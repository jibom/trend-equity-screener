name: 每日更新 HK Swing Pattern

on:
  schedule:
    - cron: "0 12 * * *"   # UTC 12:00 = 北京 20:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        working-directory: hk_swing_pattern
        run: pip install -r requirements.txt

      - name: 生成表格
        working-directory: hk_swing_pattern
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          EODHD_TOKEN: ${{ secrets.EODHD_TOKEN }}
        run: python run_swing.py

      - name: 同步到 public/ 供 Pages 展示
        run: |
          mkdir -p public/hk_swing_pattern
          cp hk_swing_pattern/index.html hk_swing_pattern/HK_Swing_Pattern.xlsx public/hk_swing_pattern/

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hk_swing_pattern/index.html hk_swing_pattern/HK_Swing_Pattern.xlsx public/hk_swing_pattern/
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "auto: 更新 HK Swing Pattern $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
