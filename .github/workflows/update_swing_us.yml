name: US Swing (07:00 HKT)

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京 07:00 (次日)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 安装依赖
        working-directory: hk_swing_pattern
        run: pip install -r requirements.txt
      - name: 生成 US 表格
        working-directory: hk_swing_pattern
        env:
          EODHD_TOKEN: ${{ secrets.EODHD_TOKEN }}
        run: python run_swing_us.py
      - name: 同步到 public + 提交 + 部署 Pages
        run: |
          mkdir -p public/hk_swing_pattern
          cp hk_swing_pattern/index.html hk_swing_pattern/HK_Swing_Pattern.xlsx hk_swing_pattern/US_Swing_Pattern.xlsx public/hk_swing_pattern/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hk_swing_pattern/index.html hk_swing_pattern/US_Swing_Pattern.xlsx public/hk_swing_pattern/
          if git diff --cached --quiet; then echo "无变化"; else git commit -m "auto: 更新 US Swing $(date -u +%Y-%m-%d)"; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
