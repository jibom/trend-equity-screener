name: HK Swing (21:00 HKT)

on:
  schedule:
    - cron: "0 13 * * *"   # UTC 13:00 = 香港 21:00 (港股16:00收盘, 21:00确保EODHD/Wind已有当日EOD)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取最新 (拿到另一市场最新xlsx, 供index重建)
        run: git pull --rebase origin main || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 安装依赖
        working-directory: hk_swing_pattern
        run: pip install -r requirements.txt
      - name: 生成 HK 表格
        working-directory: hk_swing_pattern
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          EODHD_TOKEN: ${{ secrets.EODHD_TOKEN }}
        run: python run_swing.py
      - name: 同步到 public + 提交 + 部署 Pages
        run: |
          mkdir -p public/hk_swing_pattern
          cp hk_swing_pattern/index.html hk_swing_pattern/HK_Swing_Pattern.xlsx hk_swing_pattern/US_Swing_Pattern.xlsx public/hk_swing_pattern/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hk_swing_pattern/index.html hk_swing_pattern/HK_Swing_Pattern.xlsx public/hk_swing_pattern/
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "auto: 更新 HK Swing $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
